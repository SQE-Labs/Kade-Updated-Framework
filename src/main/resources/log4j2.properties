<?xml version="1.0" encoding="UTF-8"?>
<Configuration status="WARN">
<Appenders>
<Console name="Console" target="SYSTEM_OUT">
<PatternLayout pattern="%d{HH:mm:ss} [%t] %-5level %logger{36} - %msg%n"/>
</Console>
<File name="FileLogger" fileName="logs/test.log">
<PatternLayout pattern="%d{HH:mm:ss} [%t] %-5level %logger{36} - %msg%n"/>
</File>
</Appenders>

<Loggers>
<!-- Suppress AsyncHttpClient Netty logs -->
<Logger name="org.asynchttpclient.netty" level="warn" additivity="false">
<AppenderRef ref="Console"/>
<AppenderRef ref="FileLogger"/>
</Logger>

<!-- Optional: Silence selenium internal logs -->
<Logger name="org.openqa.selenium.remote" level="warn" additivity="false">
<AppenderRef ref="Console"/>
<AppenderRef ref="FileLogger"/>
</Logger>

<!-- Your actual test logs still go through root -->
<Root level="info">
<AppenderRef ref="Console"/>
<AppenderRef ref="FileLogger"/>
</Root>
</Loggers>
</Configuration>

